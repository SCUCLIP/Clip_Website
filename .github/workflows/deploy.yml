name: Deploy
# Deploys the Worker to Cloudflare after a pull request is merged into main. The job runs in the "production"
# environment, which must require an approval from a board owner (docs/SETUP.md) before it can read the token.
# Until the CLOUDFLARE_API_TOKEN environment secret exists, it checks the code and stops without deploying.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Is Cloudflare set up yet?
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cloudflare token in the production environment yet (docs/SETUP.md step 6), so nothing is deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - if: steps.ready.outputs.ready == 'true'
        run: npm run check
      - name: Apply database migrations
        if: steps.ready.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        if: steps.ready.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
